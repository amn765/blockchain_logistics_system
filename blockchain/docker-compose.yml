version: '2.4'

networks:
  supplychain:

services:
  # Orderer
  orderer.supplychain.com:
    container_name: orderer.supplychain.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=${ORDERER_PORT:-7050}
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/supplychain.com/orderers/orderer.supplychain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/supplychain.com/orderers/orderer.supplychain.com/tls:/var/hyperledger/orderer/tls
      - ../system-genesis-block/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    ports:
      - "${ORDERER_PORT:-7050}:${ORDERER_PORT:-7050}"
    networks:
      - supplychain

  # Manufacturer Peer
  peer0.manufacturer.supplychain.com:
    container_name: peer0.manufacturer.supplychain.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.manufacturer.supplychain.com
      - CORE_PEER_ADDRESS=peer0.manufacturer.supplychain.com:${MANUFACTURER_PEER_PORT:-7051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${MANUFACTURER_PEER_PORT:-7051}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${MANUFACTURER_CHAINCODE_PORT:-7052}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.manufacturer.supplychain.com:${MANUFACTURER_PEER_PORT:-7051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.manufacturer.supplychain.com:${MANUFACTURER_PEER_PORT:-7051}
      - CORE_PEER_LOCALMSPID=ManufacturerMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/manufacturer.supplychain.com/peers/peer0.manufacturer.supplychain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/manufacturer.supplychain.com/peers/peer0.manufacturer.supplychain.com/tls:/etc/hyperledger/fabric/tls
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "${MANUFACTURER_PEER_PORT:-7051}:${MANUFACTURER_PEER_PORT:-7051}"
    networks:
      - supplychain

  # Logistics Peer
  peer0.logistics.supplychain.com:
    container_name: peer0.logistics.supplychain.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.logistics.supplychain.com
      - CORE_PEER_ADDRESS=peer0.logistics.supplychain.com:${LOGISTICS_PEER_PORT:-9051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${LOGISTICS_PEER_PORT:-9051}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${LOGISTICS_CHAINCODE_PORT:-9052}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.logistics.supplychain.com:${LOGISTICS_PEER_PORT:-9051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.logistics.supplychain.com:${LOGISTICS_PEER_PORT:-9051}
      - CORE_PEER_LOCALMSPID=LogisticsMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/logistics.supplychain.com/peers/peer0.logistics.supplychain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/logistics.supplychain.com/peers/peer0.logistics.supplychain.com/tls:/etc/hyperledger/fabric/tls
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "${LOGISTICS_PEER_PORT:-9051}:${LOGISTICS_PEER_PORT:-9051}"
    networks:
      - supplychain

  # Retailer Peer
  peer0.retailer.supplychain.com:
    container_name: peer0.retailer.supplychain.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.retailer.supplychain.com
      - CORE_PEER_ADDRESS=peer0.retailer.supplychain.com:${RETAILER_PEER_PORT:-11051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${RETAILER_PEER_PORT:-11051}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${RETAILER_CHAINCODE_PORT:-11052}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.retailer.supplychain.com:${RETAILER_PEER_PORT:-11051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.retailer.supplychain.com:${RETAILER_PEER_PORT:-11051}
      - CORE_PEER_LOCALMSPID=RetailerMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/retailer.supplychain.com/peers/peer0.retailer.supplychain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/retailer.supplychain.com/peers/peer0.retailer.supplychain.com/tls:/etc/hyperledger/fabric/tls
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "${RETAILER_PEER_PORT:-11051}:${RETAILER_PEER_PORT:-11051}"
    networks:
      - supplychain
